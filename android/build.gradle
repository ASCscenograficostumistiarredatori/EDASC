buildscript {
    ext.kotlin_version = '2.1.10'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    // Alcuni plugin datati (es. easy_pdf_viewer) dichiarano un compileSdk vecchio
    // e in release falliscono con "resource android:attr/lStar not found".
    // Li allineiamo al compileSdk del progetto.
    subprojects {
        afterEvaluate { project ->
            if (project.hasProperty('android')) {
                project.android {
                    if (compileSdkVersion == null || compileSdkVersion.tokenize('-').last().toInteger() < 35) {
                        compileSdkVersion 35
                    }
                }
            }
        }
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
